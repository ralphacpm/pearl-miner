name: Build & publish pearl-miner image

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download pearl-miner binary
        run: |
          curl -fsSL -o pearl-miner \
            https://github.com/ralphacpm/pearl-miner/releases/download/${{ github.event.release.tag_name || 'v1' }}/pearl-miner
          chmod +x pearl-miner

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/ralphacpm/pearl-miner:latest
            ghcr.io/ralphacpm/pearl-miner:${{ github.event.release.tag_name || 'v1' }}
